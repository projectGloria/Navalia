# projectGloria app release. Copy to .github/workflows/release.yml and edit only the `build` job.
#
# Runs only when started on purpose: /gloria-github-release, or `gh workflow run release.yml`.
# Pushing to main never releases.
#
#   check   (shared)  version files agree, version not released yet, gloria.toml valid, picks newest gloria-setup
#   build   (this repo) builds the app and uploads its files as the artifact `app`
#   release (shared)  packs with that gloria-setup + dry run (or, without gloria.toml, publishes the files as-is),
#                     then publishes GitHub Release v<version> with SHA256SUMS.txt
#
# The shared jobs live in projectGloria/GloriaSetup and are used from @main, so every release picks up
# the newest checks and the newest gloria-setup without editing this file.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify everything, but do not publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: projectGloria/GloriaSetup/.github/workflows/app-check.yml@main

  build:
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ---- App-specific: build, test, and copy the files to install into stage/ ----
      # Installer apps: stage/ is the app folder (it must contain gloria.toml's main_exe).
      # Extensions / Android: stage/ holds the files to publish (e.g. MyExt-<version>.zip, MyApp-<version>.apk).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Run offline release script checks
        shell: pwsh
        run: |
          ./scripts/Test-WingetAutomation.ps1
          ./scripts/Test-CodeSigning.ps1
          ./scripts/Test-ReleaseAntivirus.ps1

      - name: Build and test Settings UI
        shell: pwsh
        run: |
          Push-Location apps/settings
          try {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE) { throw 'pnpm install failed' }
            pnpm test
            if ($LASTEXITCODE) { throw 'pnpm test failed' }
            pnpm build
            if ($LASTEXITCODE) { throw 'pnpm build failed' }
          } finally { Pop-Location }

      - name: Check formatting, lints, and workspace tests
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { throw 'cargo fmt failed' }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'cargo clippy failed' }
          cargo test --workspace --locked
          if ($LASTEXITCODE) { throw 'cargo test failed' }

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --locked -p navalia -p navalia-settings
          if ($LASTEXITCODE) { throw 'cargo build failed' }

      - name: Select signing lane and validate release configuration
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_PRODUCTION_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_PRODUCTION_CERTIFICATE_THUMBPRINT }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $lane = ./scripts/Get-ReleaseSigningMode.ps1 -DryRun:($env:DRY_RUN -eq 'true') `
            -Version $env:VERSION `
            -Organization $env:SIGNPATH_ORGANIZATION_ID -Project $env:SIGNPATH_PROJECT_SLUG `
            -Policy $env:SIGNPATH_SIGNING_POLICY_SLUG `
            -ProductionThumbprint $env:SIGNPATH_PRODUCTION_CERTIFICATE_THUMBPRINT `
            -TokenPresent ([bool]$env:SIGNPATH_API_TOKEN)
          "SIGNING_MODE=$($lane.Mode)" >> $env:GITHUB_ENV
          "SIGNING_POLICY=$($lane.Policy)" >> $env:GITHUB_ENV
          Write-Host "Signing lane: $($lane.Mode)"

      - name: Collect the programs to sign
        if: env.SIGNING_MODE != 'Unsigned'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sign/binaries | Out-Null
          Copy-Item target/release/navalia.exe sign/binaries/navalia.exe
          Copy-Item target/release/navalia-settings.exe sign/binaries/navalia-settings.exe

      - name: Upload the programs to sign
        if: env.SIGNING_MODE != 'Unsigned'
        id: unsigned-binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-binaries
          path: sign/binaries

      - name: Sign the programs
        if: env.SIGNING_MODE != 'Unsigned'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: sign/binaries-signed

      - name: Verify both signed programs
        if: env.SIGNING_MODE != 'Unsigned'
        timeout-minutes: 5
        shell: pwsh
        env:
          PRODUCTION_THUMBPRINT: ${{ vars.SIGNPATH_PRODUCTION_CERTIFICATE_THUMBPRINT }}
        run: |
          ./scripts/Assert-Authenticode.ps1 -Mode $env:SIGNING_MODE `
            -ProductionThumbprint $env:PRODUCTION_THUMBPRINT -ReportDirectory sign/verification-binaries `
            -Path sign/binaries-signed/navalia.exe,sign/binaries-signed/navalia-settings.exe

      - name: Stage release binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          if ($env:SIGNING_MODE -eq 'Unsigned') {
            Copy-Item target/release/navalia.exe stage/navalia.exe -Force
            Copy-Item target/release/navalia-settings.exe stage/navalia-settings.exe -Force
          } else {
            Copy-Item sign/binaries-signed/navalia.exe stage/navalia.exe -Force
            Copy-Item sign/binaries-signed/navalia-settings.exe stage/navalia-settings.exe -Force
          }

      - name: Update Defender definitions for release analysis
        if: env.SIGNING_MODE != 'Test'
        timeout-minutes: 5
        shell: pwsh
        run: Update-MpSignature -ErrorAction Stop

      - name: Analyze the final release files with Microsoft Defender
        if: env.SIGNING_MODE != 'Test'
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./scripts/Assert-ReleaseAntivirus.ps1 -ReportDirectory antivirus-report `
            -Path stage/navalia.exe,stage/navalia-settings.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app
          path: stage/
          if-no-files-found: error

  release:
    needs: [check, build]
    uses: projectGloria/GloriaSetup/.github/workflows/app-release.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.check.outputs.version }}
      installer: ${{ needs.check.outputs.installer == 'true' }}
      gloria_setup: ${{ needs.check.outputs.gloria_setup }}
      dry_run: ${{ inputs.dry_run }}

[workspace]
resolver = "3"
members = ["crates/*", "apps/dock", "apps/settings/src-tauri", "spikes"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
windows = "0.62"
windows-core = "0.62"
windows-numerics = "0.3"
navalia-config = { path = "crates/navalia-config" }
navalia-core = { path = "crates/navalia-core" }
navalia-shell = { path = "crates/navalia-shell" }

[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Abort immediately on panic so the --guard watchdog restores the taskbar.
panic = "abort"
